[package]
name = "bitnet-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
# Enable DPAPI-protected session tokens (Windows-only, requires bitnet-dpapi).
dpapi = ["dep:bitnet-dpapi"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Memory"] }
bitnet-dpapi = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bitnet-crypto = { workspace = true }
bitnet-kdbx = { workspace = true }
bitnet-totp = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
