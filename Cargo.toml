[workspace]
members = [
    "crates/bitnet-crypto",
    "crates/bitnet-totp",
    "crates/bitnet-kdbx",
    "crates/bitnet-core",
    "crates/bitnet-dpapi",
    "crates/bitnet-ffi",
    "crates/bitnet-native-host",
    "bitnet-cli",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BitNet Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bitnet-crypto = { path = "crates/bitnet-crypto" }
bitnet-totp = { path = "crates/bitnet-totp" }
bitnet-kdbx = { path = "crates/bitnet-kdbx" }
bitnet-core = { path = "crates/bitnet-core" }
bitnet-dpapi = { path = "crates/bitnet-dpapi" }
bitnet-ffi = { path = "crates/bitnet-ffi" }
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
zeroize = { version = "1.7", features = ["derive", "serde"] }
rand = "0.8"
subtle = "2.5"
base32 = "0.5"
url = "2.5"
thiserror = "1.0"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
parking_lot = "0.12"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
