name: Dependabot
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - e2e

  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
